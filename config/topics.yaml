# 毎日この中から未使用のテーマを1つ選び、その日の全SNS投稿を作ります。
# 使ったテーマは state/history.json に記録され、一巡するまで重複しません。
categories:
  共通テスト英語リーディング:
    - 第1問〜第2問の情報検索問題を最短で解く手順
    - 第3問〜第4問の図表・メール読解で失点しない視線の動かし方
    - 第5問の物語文で時系列を整理するメモの取り方
    - 第6問の論説文・要約問題で段落要旨をつかむコツ
    - 80分の時間配分と解く順番の決め方
    - 選択肢の「言い換え」を見抜く練習法
  共通テスト英語リスニング:
    - 1回読み問題で聞き逃さない先読みのやり方
    - 数字・日時の聞き取りミスを減らすトレーニング
    - シャドーイングを効果的に続ける1日15分メニュー
    - 図表を使うリスニング問題の解き方
  医学部の英語:
    - 医学部英語で頻出の医療・生命科学テーマ
    - 医学部の長文で出る医療系英単語（臓器・疾患・研究）
    - 医学部の和訳・英文和訳で減点されない書き方
    - 医学部の自由英作文で使える論理展開の型
    - 医学部面接で英語を問われたときの準備
  学習法と計画:
    - 単語帳を1冊仕上げるための周回スケジュール
    - 模試の英語を「カルテ」のように分析して弱点を見つける方法
    - 直前期（1か月前）の英語の仕上げ方
    - 音読が長文読解のスピードを上げる理由と正しいやり方
    - 文法・語法問題を得点源にする復習のしかた
    - 英語が苦手な理系受験生が最初の3か月でやること
  私立医学部の英語:
    - 私立医学部の英語で差がつく設問形式の見分け方
    - 連続受験になる2月上旬に英語の調子を保つ方法
    - 私立医学部の英語で時間内に解き切るための演習の組み方
  保護者向け:
    - 医学部受験生の英語学習を家庭で支えるときのポイント
    - 共通テスト英語の配点と志望校の比重の見方
