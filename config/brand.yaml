# 英語カルテのブランド設定。ここを書き換えると全SNSの文章・画像に反映されます。
# 出典: https://eigokarte.com/ （2026-10-05 時点）
name: 英語カルテ
tagline: AIが書き、人が疑い、あなたが解く。
description: >-
  英語カルテは、医学部受験生のための英語教材サイトです。
  共通テストから私立医学部27校まで、各大学の出題傾向に合わせたオリジナル英文問題を提供しています。
  AIで英文を作成し、正解・和訳・文法解説・事実関係を人の手で1問ずつ検証しています
  （約400題を点検し、延べ300箇所以上を修正。検証記録も公開）。
  現役の医学部予備校講師が制作し、自動採点・タイマー機能付き。
  無料教材は全機能公開、有料教材は1,900円からの買い切りです。
url: https://eigokarte.com/
audience: 医学部志望の高校生・浪人生、共通テスト英語で高得点を狙う受験生、医学部予備校・塾の英語指導者
tone: 誠実で具体的。煽らない。根拠のある学習法だけを伝える。です・ます調。
